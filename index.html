<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>迴圈生存者</title>
  </head>
  <body>
    <div id="editor">
      <div id="editor-head">
        <div><b>容量</b> ＝ 腳本最多能放幾塊積木，每塊佔 1 格。滿了就拖不出新積木</div>
        <div><b>×N</b> ＝ 這一輪執行了幾次。外層與內層的數字差，就是巢狀迴圈</div>
      </div>
      <div id="editor-tabs">
        <button type="button" data-tab="attack" class="active">攻擊腳本</button>
        <button type="button" data-tab="arrow">箭矢路徑</button>
      </div>
      <div id="blockly"></div>
      <div id="blockly-arrow" class="hidden"></div>
      <div id="preview">
        <span class="preview-label">試射預覽</span>
        <canvas id="preview-canvas"></canvas>
      </div>
    </div>
    <div id="splitter"></div>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="levelup" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
