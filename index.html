<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>迴圈生存者</title>
  </head>
  <body>
    <div id="editor">
      <div id="editor-head">
        <div id="head-attack">
          <div><b>容量</b> ＝ 腳本最多能放幾塊積木，每塊佔 1 格。滿了就拖不出新積木</div>
          <div><b>×N</b> ＝ 這一輪執行了幾次。外層與內層的數字差，就是巢狀迴圈</div>
        </div>
        <div id="head-shape" class="hidden">
          <div><b>正 N 邊形</b>的每次轉角 ＝ <b>360 ÷ N</b>。圖形要閉合才會有護盾</div>
          <div>邊數越多，護盾的傷害加成越高。暫停時的預覽會顯示缺口在哪</div>
        </div>
      </div>
      <div id="editor-tabs">
        <button type="button" data-tab="attack" class="active">攻擊腳本</button>
        <button type="button" data-tab="shape">護盾形狀</button>
        <button type="button" data-tab="save">存檔</button>
      </div>
      <div id="slots"></div>
      <div id="blockly"></div>
      <div id="blockly-shape"></div>
      <div id="savepanel" class="hidden">
        <div class="save-section">
          <div class="save-title">我是誰</div>
          <div class="save-row">
            <input id="save-class" type="text" placeholder="班級（例：三年二班）" maxlength="16" />
            <input id="save-seat" type="text" placeholder="座號" maxlength="4" />
          </div>
          <div class="save-note">
            班級座號會寫進分享碼裡。交作業時老師看得出這是誰的存檔 ——
            用別人的碼會顯示別人的名字。
          </div>
        </div>

        <div class="save-section">
          <div class="save-title">產生分享碼</div>
          <button id="save-make" type="button" class="save-btn">產生</button>
          <textarea id="save-out" readonly placeholder="按「產生」後這裡會出現一長串文字，全選複製交給老師"></textarea>
          <button id="save-copy" type="button" class="save-btn ghost">複製</button>
        </div>

        <div class="save-section">
          <div class="save-title">讀取分享碼</div>
          <textarea id="save-in" placeholder="把分享碼貼在這裡"></textarea>
          <button id="save-load" type="button" class="save-btn ghost">讀取</button>
          <div id="save-status" class="save-note"></div>
        </div>

        <div class="save-section">
          <div class="save-title">示範存檔</div>
          <button id="save-demo" type="button" class="save-btn ghost">載入示範（兩個腳本槽）</button>
          <div class="save-note">
            課堂示範用。載入後會有「散射流」與「蓄力流」兩套腳本，
            按數字鍵 1、2 可以即時切換。
        </div>
      </div>
      <div id="panel-status"></div>
      <div id="preview">
        <span class="preview-label">試射預覽</span>
        <canvas id="preview-canvas"></canvas>
      </div>
    </div>
    <div id="splitter"></div>
    <canvas id="game"></canvas>
    <div id="monitor"></div>
    <div id="hud"></div>
    <div id="levelup" class="hidden"></div>
    <div id="gameover" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
